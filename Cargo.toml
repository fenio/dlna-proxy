[package]
name = "dlna-proxy"
version = "0.6.2"
authors = ["Nic0w", "Bartosz Fenski <fenio@debian.org>"]
edition = "2021"
description = "A DLNA proxy that enables use of a DLNA server past the local network boundary"
license = "GPL-3.0"
repository = "https://github.com/fenio/dlna-proxy"
homepage = "https://github.com/fenio/dlna-proxy"
readme = "README.md"
keywords = ["dlna", "upnp", "ssdp", "proxy", "media"]
categories = ["network-programming", "multimedia"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
httparse = "=1.10.1"
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive"] }
nix = { version = "=0.31.3", features = ["socket"] }
fern = "=0.7.1"
toml = "=1.1.8"
log = { version = "=0.4.34", features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "signal", "io-util"] }
socket2 = { version = "=0.6.5", features = ["all"] }
